<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | MediCare HMS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-container">
      <div class="login-card">
        <div class="login-brand">
          <div class="logo">+</div>
          <h1>MediCare HMS</h1>
          <p>Enterprise Hospital Management System</p>
        </div>
        
        <div id="message" class="alert"></div>
        
        <form id="login">
          <div class="field">
            <label for="u">Username</label>
            <input id="u" placeholder="Enter your username" required autofocus>
          </div>
          <div class="field">
            <label for="p">Password</label>
            <input id="p" type="password" placeholder="Enter your password" required>
          </div>
          <button class="btn btn-primary" style="width:100%">Sign In to Portal</button>
        </form>
        
        <button class="btn btn-secondary" style="width:100%;margin-top:12px" onclick="document.getElementById('reg').style.display='block'">Create User Account</button>
        
        <form id="reg" style="display:none;margin-top:18px">
          <hr>
          <div style="margin-bottom:14px;font-weight:700;font-size:13px;color:var(--slate-800)">New User Registration</div>
          <div class="field">
            <label for="ru">Username</label>
            <input id="ru" placeholder="Choose a username" required>
          </div>
          <div class="field">
            <label for="rp">Password</label>
            <input id="rp" type="password" placeholder="Choose a password" required>
          </div>
          <div class="field">
            <label for="rr">Role</label>
            <select id="rr">
              <option>ADMIN</option>
              <option>DOCTOR</option>
              <option>STAFF</option>
            </select>
          </div>
          <button class="btn btn-success" style="width:100%;margin-top:10px">Register Account</button>
        </form>
      </div>
      
      <div class="login-footer-trust">
        <span>🔒 256-Bit SSL Encrypted</span>
        <span>•</span>
        <span>🏥 HIPAA Compliant</span>
        <span>•</span>
        <span>✓ ISO 27001 Certified</span>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const m=document.getElementById('message');
    document.getElementById('login').onsubmit=async e=>{
      e.preventDefault();
      try{
        const r=await API.post('/users/login?username='+encodeURIComponent(u.value)+'&password='+encodeURIComponent(p.value));
        localStorage.setItem('hmsUser',JSON.stringify(r));
        location='dashboard.html';
      }catch(x){
        m.className='alert error show';
        m.textContent=x.message;
      }
    };
    document.getElementById('reg').onsubmit=async e=>{
      e.preventDefault();
      try{
        await API.post('/users/register',{userName:ru.value,password:rp.value,role:rr.value});
        m.className='alert success show';
        m.textContent='User registered. Sign in now.';
        e.target.reset();
        e.target.style.display='none';
        window.scrollTo({top:0,behavior:'smooth'});
        u.focus();
      }catch(x){
        m.className='alert error show';
        m.textContent=x.message;
      }
    };
  </script>
</body>
</html>
